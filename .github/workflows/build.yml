name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: Build Velocity and Paper plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Setup Maven
        run: mvn --version
      - name: Run all tests with updated dependencies
        run: mvn --batch-mode -U clean test
      - name: Package both plugins with updated dependencies
        run: mvn --batch-mode -U clean package
      - name: Verify plugin artifacts and API isolation
        shell: bash
        run: |
          set -euo pipefail
          velocity_jar='imperialresourcepack-velocity/target/ImperialResourcePack-Velocity.jar'
          paper_jar='imperialresourcepack-paper/target/ImperialResourcePack-1.2.0.jar'

          for artifact in "$velocity_jar" "$paper_jar"; do
            test -s "$artifact"
            jar tf "$artifact" > /dev/null
          done

          if jar tf "$velocity_jar" | grep -qE '^(org/bukkit/|io/papermc/paper/)'; then
            echo 'Velocity JAR must not bundle Paper API classes.' >&2
            exit 1
          fi
          if jar tf "$paper_jar" | grep -q '^com/velocitypowered/api/'; then
            echo 'Paper JAR must not bundle Velocity API classes.' >&2
            exit 1
          fi

          jar tf "$velocity_jar" | grep -qx 'velocity-plugin.json'
          jar tf "$velocity_jar" | grep -qx 'config.yml'
          jar tf "$paper_jar" | grep -qx 'plugin.yml'
          jar tf "$paper_jar" | grep -qx 'config.yml'
          du -h "$velocity_jar" "$paper_jar"

          printf '%s\\n' 'ImperialResourcePack 1.2.0 TEST RESULTS' > TEST_RESULTS.txt
          printf '%s\\n' '=========================================' >> TEST_RESULTS.txt
          printf '%s\\n' 'mvn clean test: PASS' >> TEST_RESULTS.txt
          printf '%s\\n' 'mvn clean package: PASS' >> TEST_RESULTS.txt
          printf '%s\\n' '27 route resolver tests: PASS' >> TEST_RESULTS.txt
          printf '%s\\n' 'Representative clients: 1.8.9, 1.14.4, 1.20.4, 1.21.1, 1.21.4, 1.21.8, 1.21.9, 1.21.10, 1.21.11, 26.2, 26.3: PASS' >> TEST_RESULTS.txt
          printf '%s\\n' 'Nested discovery, duplicate basename, missing pack.mcmeta, protocol routing: PASS' >> TEST_RESULTS.txt
      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: ImperialResourcePack-Velocity.jar
          path: imperialresourcepack-velocity/target/ImperialResourcePack-Velocity.jar
          if-no-files-found: error
      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: ImperialResourcePack-1.2.0.jar
          path: imperialresourcepack-paper/target/ImperialResourcePack-1.2.0.jar
          if-no-files-found: error

      - name: Create source bundle
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=ImperialResourcePack-1.2.0/ HEAD -o ImperialResourcePack-1.2.0-Source.zip
          cp imperialresourcepack-paper/src/main/resources/config.yml config.yml
      - name: Upload source and release files
        uses: actions/upload-artifact@v4
        with:
          name: ImperialResourcePack-1.2.0-Source.zip
          path: |
            ImperialResourcePack-1.2.0-Source.zip
            config.yml
            TEST_RESULTS.txt
