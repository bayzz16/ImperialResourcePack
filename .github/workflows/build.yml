name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: Build Velocity and Paper plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Setup Maven
        run: mvn --version
      - name: Run all tests with updated dependencies
        run: mvn --batch-mode -U clean test
      - name: Package both plugins with updated dependencies
        run: mvn --batch-mode -U clean package
      - name: Verify plugin artifacts and API isolation
        shell: bash
        run: |
          set -euo pipefail
          velocity_jar='imperialresourcepack-velocity/target/ImperialResourcePack-Velocity.jar'
          paper_jar='imperialresourcepack-paper/target/ImperialResourcePack-Paper.jar'

          for artifact in "$velocity_jar" "$paper_jar"; do
            test -s "$artifact"
            jar tf "$artifact" > /dev/null
          done

          if jar tf "$velocity_jar" | grep -qE '^(org/bukkit/|io/papermc/paper/)'; then
            echo 'Velocity JAR must not bundle Paper API classes.' >&2
            exit 1
          fi
          if jar tf "$paper_jar" | grep -q '^com/velocitypowered/api/'; then
            echo 'Paper JAR must not bundle Velocity API classes.' >&2
            exit 1
          fi

          jar tf "$velocity_jar" | grep -qx 'velocity-plugin.json'
          jar tf "$velocity_jar" | grep -qx 'config.yml'
          jar tf "$paper_jar" | grep -qx 'plugin.yml'
          jar tf "$paper_jar" | grep -qx 'config.yml'
          du -h "$velocity_jar" "$paper_jar"
      - name: Upload Velocity plugin
        uses: actions/upload-artifact@v4
        with:
          name: ImperialResourcePack-Velocity.jar
          path: imperialresourcepack-velocity/target/ImperialResourcePack-Velocity.jar
          if-no-files-found: error
      - name: Upload Paper plugin
        uses: actions/upload-artifact@v4
        with:
          name: ImperialResourcePack-Paper.jar
          path: imperialresourcepack-paper/target/ImperialResourcePack-Paper.jar
          if-no-files-found: error
