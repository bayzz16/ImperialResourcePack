enabled: true
packs-directory: "packs"
active-pack: "1.21.10"

delivery:
  enabled: true
  required: false
  prompt: "<gradient:#7C4DFF:#29B6F6><bold>ɪᴍᴘᴇʀɪᴀʟ</bold></gradient> <gray>•</gray> <white>ʀᴇꜱᴏᴜʀᴄᴇ ᴘᴀᴄᴋ</white>
  send-delay-ms: 1500
  resend-on-server-switch: false

hosting:
  enabled: true
  bind: "0.0.0.0"
  port: 8199
  path: "/pack"
  public-url: "http://play.imperial.biz.id/pack"

validation:
  require-pack-mcmeta: true
  max-size-mb: 256

version-mapping: false
debug: false
version-mapping-fallback-to-active: true

auto-reload:
  enabled: false
  interval-ms: 2000

stats:
  enabled: true

# Optional named pack profiles.
# profiles:
#   default: "ResourcePack-Java_PALING-BARU.zip"
#   rpg: "ResourcePack-Java_1.21.9-1.21.10.zip"
